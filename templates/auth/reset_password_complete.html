{% extends "components/base_public.html" %}

{% block title %}Password Reset Complete – {{ college.short_name }}{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--nay-bg);">
  <div style="width: 100%; max-width: 420px;">

    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 48px; height: 48px; background: var(--nay-green, #198754); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.5rem; color: #fff;">✓</div>
      <h1 style="font-size: 1.375rem; font-weight: 700; margin-bottom: 0.5rem;">Password reset complete</h1>
      <p style="color: var(--nay-text-muted); font-size: 0.9375rem; line-height: 1.6;">
        Your password has been set. You can now sign in with your new password.
      </p>
    </div>

    <div class="nay-card" style="padding: 1.5rem; text-align: center;">
      <a href="{% url 'auth:login' %}" class="btn btn-primary" style="display: inline-flex; justify-content: center; padding: 10px 24px; width: 100%;">
        Sign In
      </a>
    </div>

  </div>
</div>
{% endblock %}
